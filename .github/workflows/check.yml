name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The module tests run against the engine itself, so CI needs a Claude
      # Code that loads modules (2.1.267+).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate, then run the hook and module tests
        run: ./scripts/check.sh
      - name: Lint shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck scripts/recall-approve.sh scripts/check.sh
